```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Khan Pizza Hut CMS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="sidebar">

<div class="logo">
🍕
<h2>KPH CMS</h2>
</div>

<ul>

<li class="active">
<i class="fa-solid fa-utensils"></i>
<span>Menu</span>
</li>

<li>
<i class="fa-solid fa-star"></i>
<span>Reviews</span>
</li>

<li>
<i class="fa-solid fa-gear"></i>
<span>Settings</span>
</li>

<li>
<i class="fa-solid fa-chart-line"></i>
<span>Analytics</span>
</li>

</ul>

</div>

<div class="main">

<div class="topbar">

<h1>Menu Management</h1>

<div class="search">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search menu...">

</div>

</div>

<div class="stats">

<div class="stat-card">
<h3 id="totalItems">0</h3>
<p>Total Items</p>
</div>

<div class="stat-card">
<h3 id="featuredItems">0</h3>
<p>Featured</p>
</div>

<div class="stat-card">
<h3 id="stockItems">0</h3>
<p>In Stock</p>
</div>

<div class="stat-card">
<h3 id="categories">0</h3>
<p>Categories</p>
</div>

</div>

<div class="toolbar">

<select id="categoryFilter">

<option value="all">All Categories</option>

<option value="Burger">Burger</option>

<option value="Pizza">Pizza</option>

<option value="Deals">Deals</option>

<option value="Drinks">Drinks</option>

</select>

<button id="addItemBtn">

<i class="fa-solid fa-plus"></i>

Add Item

</button>

</div>

<div id="menuList" class="menu-list">

<!-- Firebase Items -->

</div>

</div>

<div id="editor" class="modal hidden">

<div class="modal-box">

<h2 id="editorTitle">
Add Menu Item
</h2>

<input id="itemName" placeholder="Item Name">

<input id="itemPrice" type="number" placeholder="Price">

<input id="itemImage" placeholder="Image URL">

<img id="previewImage">

<textarea
id="itemDescription"
placeholder="Description">
</textarea>

<select id="itemCategory">

<option>Burger</option>
<option>Pizza</option>
<option>Deals</option>
<option>Drinks</option>

</select>

<input
id="itemDiscount"
type="number"
placeholder="Discount %">

<label>

<input
type="checkbox"
id="itemStock"
checked>

In Stock

</label>

<label>

<input
type="checkbox"
id="itemFeatured">

Featured

</label>

<label>

<input
type="checkbox"
id="itemVisible"
checked>

Visible

</label>

<div class="buttons">

<button id="saveBtn">

Save

</button>

<button id="cancelBtn">

Cancel

</button>

</div>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
```
